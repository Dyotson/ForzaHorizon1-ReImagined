# Codegen manifest for Forza Horizon (4D5309C9) with Title Update 4 (default.xex 0.0.4.12,
# module hash 336A44DC03EC8782): the executable and facade DLLs that
# tools/apply_title_update.py writes to extracted/tu4/ (docs/dlc.md). Hints in hints_tu4/
# (ported from hints/ with tools/tu_address_map.py, then completed with the finder tools).
# Build with -DFORZA_TITLE_UPDATE=4.

[project]
name = "forza"
sdk_version = "0.10.0"
game_root = "../extracted/tu4"

[entrypoint]
