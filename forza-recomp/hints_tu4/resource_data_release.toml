# The crash in races (#83): the resources' load step (sub_82CE2A38; sub_82C222C8 on the
# disc; vtable slot 22 of the cacheable resources) takes its data object from
# resource+0x40 and releases it; the object had been freed. The hook takes the field with
# an atomic exchange and drops an object whose vtable is not in the image (logged).
# src/hooks/resource_data_release.cpp.
[[midasm_hook]]
address = 0x82CE2A60
name = "ForzaTakeResourceData_82C222F0"
registers = ["r3"]
jump_address = 0x82CE2A70

# All 19 unload implementations sharing the load step above must take +0x40
# atomically too. Each hook replaces the load, zero, compare and clear, leaving
# the original null branch, virtual Release and resource-specific cleanup intact.

# sub_82CE1E30: saved resource r11, zero r10.
[[midasm_hook]]
address = 0x82CE1E40
name = "ForzaUnloadResourceDataR10"
registers = ["r3"]
jump_address = 0x82CE1E50

# sub_82CE3000: saved resource r31, zero r11.
[[midasm_hook]]
address = 0x82CE3014
name = "ForzaUnloadResourceDataR11"
registers = ["r3"]
jump_address = 0x82CE3024

