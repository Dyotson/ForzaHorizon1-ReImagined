# Flatpak manifest (issue #1). See docs/launcher.md, "Flatpak".
#
# The runtime is org.freedesktop.Sdk itself, not Platform: the launcher compiles the game on the
# player's machine, so the C++ headers, glibc, cmake, ninja and python must exist at run time, and
# only the Sdk carries them. The compiler is the Sdk's LLVM extension (clang 22; the launcher
# accepts clang >= 21), declared below as an extension of this app so that flatpak installs it
# together with the app. Nothing of the game is in this package.
#
# Build (from the repository root):
#   flatpak/stage.py --overlay rexglue-overlay-linux-amd64.tar.gz --sdk-license LICENSE-of-the-SDK
#   flatpak-builder --user --install --force-clean build-dir flatpak/io.github.dyotson.ForzaHorizon1ReImagined.yml
app-id: io.github.dyotson.ForzaHorizon1ReImagined
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: forza-reimagined

finish-args:
  - --share=ipc
  - --share=network                # the Forza Live server; the SDK download; the pinned LLVM fallback
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all                   # GPU (Vulkan), game controllers
  # The player's own game files (a Games on Demand package is a file plus a <name>.data folder,
  # which the file chooser portal would not hand over together), title update and DLC. Read only.
  - --filesystem=home:ro
  - --filesystem=xdg-download      # verified launcher bundles for manual installation
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro
  - --filesystem=/mnt:ro
  - --talk-name=org.freedesktop.ScreenSaver
  # Local Rich Presence, only when the player enables it. No Discord account access.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord
  - --filesystem=xdg-run/app/com.discordapp.DiscordCanary

add-extensions:
  org.freedesktop.Sdk.Extension.llvm22:
    directory: lib/sdk/llvm22
    version: '26.08'
    autodownload: true
    autodelete: false

cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/sdk/llvm22

modules:
  # The launcher's main third-party dependency. PySide6 6.12 wheels (Qt 6.12 inside), pinned.
  - name: pyside6
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-build-isolation pyside6_essentials shiboken6
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/7b/3c/7597d8dcb36aa8315427635ec6ec9d850ffbad4ce78b9118ac854889f2d3/pyside6_essentials-6.12.0-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 16f4b5e41daf49235ae048458243da9efe5f3d8040f9cc5aa454ce69893d3bd9
        only-arches: [x86_64]
      - type: file
        url: https://files.pythonhosted.org/packages/49/c2/a04fa003b4360e99d8e3fc2829abacf37396ace63ea1cd616402209ec7c6/shiboken6-6.12.0-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 3bde565bb0890044b5c7f63808adddede5abc241e9395a2bfed61919884d6240
        only-arches: [x86_64]

  # SDL's mapped controller API; the same runtime is bundled with the standalone launchers.
  - name: launcher-gamepad
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-build-isolation PySDL2 pysdl2-dll
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/5d/e2/399ea7900e7510096aeb41439e6f1540bef0bdf7e15cc2d8464e4adb71e8/PySDL2-0.9.17-py3-none-any.whl
        sha256: fe923dbf5c7b27bbc1eb2bf58abfa793f8f13fd7ae8b27b1bc2de49920bcbd41
      - type: file
        url: https://files.pythonhosted.org/packages/2b/1c/91fb667c3968b420de5dd76e840259b44b876b6fc84c5889151633fcc06e/pysdl2_dll-2.32.10-py2.py3-none-manylinux_2_28_x86_64.whl
        sha256: 1e6139e3ce832d95d8376b77f4c9288bef34d6b131f844f2a5fcc8873ce8e6da
        only-arches: [x86_64]

  # certifi's CA bundle, the launcher's fallback when the runtime has none for its OpenSSL (#85).
  - name: certifi
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-build-isolation certifi
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/0b/a7/71ac2cff56fec219ed242bb11b8efb69fcc4bec75db06fb7bfe35de520e6/certifi-2026.7.22-py3-none-any.whl
        sha256: 62f22742b58a1a33014a2b6b706588a8d7e2a88ae7bd1a6ebe8c992928483775

  - name: forza-reimagined
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/share/forza-reimagined
      - cp -r stage/. ${FLATPAK_DEST}/share/forza-reimagined/
      - python3 -m compileall -q ${FLATPAK_DEST}/share/forza-reimagined/forza_launcher
      - install -Dm755 forza-reimagined.sh ${FLATPAK_DEST}/bin/forza-reimagined
      - install -Dm644 io.github.dyotson.ForzaHorizon1ReImagined.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 io.github.dyotson.ForzaHorizon1ReImagined.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 stage/assets/logo.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.dyotson.ForzaHorizon1ReImagined.svg
      - install -Dm644 stage/assets/logo.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.dyotson.ForzaHorizon1ReImagined.png
    sources:
      - type: dir
        path: stage
        dest: stage
      - type: file
        path: forza-reimagined.sh
      - type: file
        path: io.github.dyotson.ForzaHorizon1ReImagined.desktop
      - type: file
        path: io.github.dyotson.ForzaHorizon1ReImagined.metainfo.xml
