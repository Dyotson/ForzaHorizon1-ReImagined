name: guest-fma-tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'forza-recomp/cmake/GuestFma.cmake'
      - 'forza-recomp/cmake/CpuTarget.cmake'
      - 'forza-recomp/src/platform/guest_cpu.cpp'
      - 'forza-recomp/src/platform/cpu_target.cpp'
      - 'forza-recomp/tests/guest_fma/**'
      - '.github/workflows/guest-fma-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check baseline and v3 with guest FMA off and on
        shell: bash
        run: |
          set -euo pipefail
          for target in baseline x86-64-v3; do
            for fma in OFF ON; do
              build="$RUNNER_TEMP/fma-$target-$fma"
              cmake -S forza-recomp/tests/guest_fma -B "$build" \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ \
                -DFORZA_CPU_TARGET="$target" -DFORZA_GUEST_FMA="$fma"
              cmake --build "$build" --parallel 1
              ctest --test-dir "$build" --output-on-failure
            done
          done
