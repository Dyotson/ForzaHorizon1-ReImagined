name: challenge-hud-tests
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  garage-capacity-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S forza-recomp/tests/garage-capacity -B garage-capacity-tests
      - run: cmake --build garage-capacity-tests --config Debug
      - run: ctest --test-dir garage-capacity-tests -C Debug --output-on-failure
      - run: python -m unittest discover -s launcher -p test_garage.py
  native-message-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang-cl /nologo /std:c++17 /EHsc /W4 /WX forza-recomp/tests/challenge_hud_test.cpp /Fe:challenge-hud-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\challenge-hud-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl /nologo /std:c++17 /EHsc /W4 /WX forza-recomp/tests/achievement_hud_test.cpp /Fe:achievement-hud-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\achievement-hud-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl /nologo /std:c++17 /EHsc /W4 /WX /Iforza-recomp/tests/stall-stubs forza-recomp/tests/stall_watch_test.cpp /Fe:stall-watch-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\stall-watch-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-cl /nologo /std:c++17 /EHsc /W4 /WX /DFORZA_CPU_TARGET_V3=1 forza-recomp/tests/cpu_target_test.cpp forza-recomp/src/platform/cpu_target.cpp user32.lib /Fe:cpu-target-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\cpu-target-test.exe
      - if: runner.os != 'Windows'
        run: |
          g++ -std=c++17 -pthread -Wall -Wextra -Werror forza-recomp/tests/challenge_hud_test.cpp -o challenge-hud-test
          ./challenge-hud-test
          g++ -std=c++17 -pthread -Wall -Wextra -Werror forza-recomp/tests/achievement_hud_test.cpp -o achievement-hud-test
          ./achievement-hud-test
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -Iforza-recomp/tests/stall-stubs forza-recomp/tests/stall_watch_test.cpp -o stall-watch-test
          ./stall-watch-test
      - if: runner.os == 'Linux'
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -DFORZA_CPU_TARGET_V3=1 forza-recomp/tests/cpu_target_test.cpp forza-recomp/src/platform/cpu_target.cpp -o cpu-target-test
          ./cpu-target-test
