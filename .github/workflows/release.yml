# Builds the launcher installers and attaches them to the release.
#
# The installers and the Flatpak bundle hold the launcher, the project's own sources, the Forza Live server and the
# patched ReXGlue SDK pieces. They hold NO game code, NO game data and NO built game: the
# launcher builds the game on the player's computer from their own copy of Forza Horizon.
#
# Runs on tags v* (and creates the release), on pull requests to main (the required checks,
# artifacts only) and by hand (artifacts only).
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main, 'launcher-stack/**', feature/physics-trigger-feedback]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  launcher-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libfontconfig1 libfreetype6 libxkbcommon0 libdbus-1-3
      - name: Install launcher dependencies
        run: python -m pip install -r launcher/requirements.txt
      - name: Verify Qt runtime is available
        run: python -c "from PySide6.QtWidgets import QApplication"
      - name: Launcher unit and Qt tests
        run: python -m unittest discover -s launcher -p 'test_*.py' -v
      - name: Livery codec tests
        run: python -m unittest discover -s tools -p 'test_livery_codec.py' -v
      - if: runner.os == 'Linux'
        name: Resource cache eviction lifetime regression
        run: |
          g++ -std=c++20 -O2 -pthread forza-recomp/tests/resource_cache_lock_test.cpp -o "$RUNNER_TEMP/resource-cache-test"
          "$RUNNER_TEMP/resource-cache-test"
      - if: runner.os == 'Linux'
        name: Gamertag text cleaning
        run: |
          g++ -std=c++20 -O2 -I forza-recomp/src/kernel forza-recomp/tests/gamertag_text_test.cpp -o "$RUNNER_TEMP/gamertag-test"
          "$RUNNER_TEMP/gamertag-test"
      - if: runner.os == 'Linux'
        name: On-screen keyboard
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I forza-recomp/src/kernel forza-recomp/tests/osk_test.cpp -o "$RUNNER_TEMP/osk-test"
          "$RUNNER_TEMP/osk-test"
      - if: runner.os == 'Linux'
        name: Speed trap leaderboard placing
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I forza-recomp/src forza-recomp/tests/ambient_leaderboard_test.cpp -o "$RUNNER_TEMP/ambient-leaderboard-test"
          "$RUNNER_TEMP/ambient-leaderboard-test"
      - if: runner.os == 'Linux'
        name: Racing wheel driving gate
        run: |
          g++ -std=c++20 -O2 -pthread -Wall -Wextra -Werror -I forza-recomp/src forza-recomp/tests/driving_gate_test.cpp -o "$RUNNER_TEMP/driving-gate-test"
          "$RUNNER_TEMP/driving-gate-test"

  # The patched SDK pieces for Linux: the plugin, runtime and codegen tool built from the SDK
  # source with this repository's patches (tools/build_rexglue_sdk.sh). Cached on the patches.
  sdk-linux:
    # 22.04: the oldest runner image, so the overlay needs glibc 2.35 only
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Test Linux dependency retry handling
        run: python3 -m unittest launcher/test_ci_linux_sdk_setup.py
      - id: cache
        uses: actions/cache@v4
        with:
          path: rexglue-overlay-linux-amd64.tar.gz
          key: sdk-overlay-linux-${{ hashFiles('patches/rexglue-sdk/**', 'tools/build_rexglue_sdk.sh', 'forza-recomp/tests/wheel_ff_reject_test.cpp', 'forza-recomp/tests/wheel_thrustmaster_test.cpp', 'forza-recomp/tests/wheel_rumble_test.cpp', 'forza-recomp/tests/wheel_ff_test.cpp', 'forza-recomp/tests/wheel_devices_test.cpp', 'forza-recomp/tests/wheel_buttons_test.cpp', 'forza-recomp/tests/wheel_shifter_test.cpp', 'forza-recomp/tests/wheel_min_force_test.cpp', 'forza-recomp/tests/wheel_gear_request_test.cpp', 'forza-recomp/tests/wheel_handbrake_test.cpp', 'forza-recomp/tests/wheel_primary_test.cpp', 'tools/test_wait_wakeups.cpp', 'tools/test_driver_pipeline_cache.cpp', 'tools/test_pipeline_store.cpp', 'tools/test_render_target_trim.cpp', 'tools/test_gamepad_remap.cpp', 'tools/test_pipeline_prebuild.cpp', 'tools/test_vfs_host_errors.cpp', 'tools/test_xma_invalid_input.cpp', 'launcher/packaging/ci_linux_sdk_setup.sh', 'launcher/packaging/ci_toolchain_debs.txt', 'launcher/forza_launcher/pins.py') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build dependencies, LLVM, CMake and the pinned SDK nightly
        run: |
          launcher/packaging/ci_linux_sdk_setup.sh
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"
          echo "$HOME/cmake/bin" >> "$GITHUB_PATH"
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build the patched SDK pieces
        run: |
          REXSDK_JOBS="$(nproc)" tools/build_rexglue_sdk.sh
          clang++ -std=c++23 -fsyntax-only -I"$HOME/rexglue-sdk-src-forza/sdk/include" \
            -I"$HOME/rexglue-sdk-src-forza/sdk/thirdparty/fmt/include" \
            tools/test_sdk_clock_conversions.cpp
          clang++ -std=c++20 -pthread -I"$HOME/rexglue-sdk-src-forza/sdk/include" \
            tools/test_driver_pipeline_cache.cpp -o "$RUNNER_TEMP/driver-cache-test"
          "$RUNNER_TEMP/driver-cache-test"
          clang++ -std=c++20 -I"$HOME/rexglue-sdk-src-forza/sdk/include" \
            tools/test_pipeline_store.cpp -o "$RUNNER_TEMP/pipeline-store-test"
          "$RUNNER_TEMP/pipeline-store-test"
          clang++ -std=c++17 -I"$HOME/rexglue-sdk-src-forza/sdk/src/graphics/vulkan" \
            tools/test_render_target_trim.cpp -o "$RUNNER_TEMP/render-target-trim-test"
          "$RUNNER_TEMP/render-target-trim-test"
          clang++ -std=c++17 -I"$HOME/rexglue-sdk-src-forza/sdk/src/input/sdl" \
            tools/test_gamepad_remap.cpp -o "$RUNNER_TEMP/gamepad-remap-test"
          "$RUNNER_TEMP/gamepad-remap-test"
          clang++ -std=c++17 -Wall -Wextra -Werror -I"$HOME/rexglue-sdk-src-forza/sdk/include" \
            forza-recomp/tests/wheel_buttons_test.cpp -o "$RUNNER_TEMP/wheel-buttons-test"
          "$RUNNER_TEMP/wheel-buttons-test"
          clang++ -std=c++17 -Wall -Wextra -Werror -I"$HOME/rexglue-sdk-src-forza/sdk/include" \
            -I"$HOME/rexglue-sdk-src-forza/sdk/src/input/wheel" \
            forza-recomp/tests/wheel_devices_test.cpp -o "$RUNNER_TEMP/wheel-devices-test"
          "$RUNNER_TEMP/wheel-devices-test"
          clang++ -std=c++17 -Wall -Wextra -Werror -I"$HOME/rexglue-sdk-src-forza/sdk/include" \
            -I"$HOME/rexglue-sdk-src-forza/sdk/src/input/wheel" \
            forza-recomp/tests/wheel_rumble_test.cpp -o "$RUNNER_TEMP/wheel-rumble-test"
          "$RUNNER_TEMP/wheel-rumble-test"
          # #303: the minimum force, the H-pattern gear on lever moves (and the shifter it sits
          # on), the analog handbrake and which device is the wheel (patches 0131-0134, #306);
          # #308: Thrustmaster wheels and refused effects (0135, 0136).
          for t in wheel_shifter wheel_min_force wheel_gear_request wheel_handbrake \
                   wheel_primary wheel_thrustmaster wheel_ff_reject; do
            clang++ -std=c++17 -Wall -Wextra -Werror -I"$HOME/rexglue-sdk-src-forza/sdk/include" \
              -I"$HOME/rexglue-sdk-src-forza/sdk/src/input/wheel" \
              "forza-recomp/tests/${t}_test.cpp" -o "$RUNNER_TEMP/${t}-test"
            "$RUNNER_TEMP/${t}-test"
          done
          clang++ -std=c++17 -Wall -Wextra -Werror -I"$HOME/rexglue-sdk-src-forza/sdk/include" \
            forza-recomp/tests/wheel_ff_test.cpp -o "$RUNNER_TEMP/wheel-ff-test"
          "$RUNNER_TEMP/wheel-ff-test"
          clang++ -std=c++20 -I"$HOME/rexglue-sdk-src-forza/sdk/include" \
            tools/test_pipeline_prebuild.cpp -o "$RUNNER_TEMP/pipeline-prebuild-test"
          "$RUNNER_TEMP/pipeline-prebuild-test"
          overlay="$HOME/rexglue-sdk-patched-forza/0.10.0.24/linux-amd64"
          clang++ -std=c++23 -pthread -I"$overlay/include" tools/test_vfs_host_errors.cpp \
            -L"$overlay/lib" -lrexruntime -Wl,-rpath,"$overlay/lib" -o "$RUNNER_TEMP/vfs-host-errors-test"
          "$RUNNER_TEMP/vfs-host-errors-test"
          clang++ -std=c++23 -pthread -DSPDLOG_FMT_EXTERNAL -DSPDLOG_COMPILED_LIB -I"$overlay/include" \
            tools/test_xma_invalid_input.cpp -L"$overlay/lib" -lrexruntime -Wl,-rpath,"$overlay/lib" \
            -o "$RUNNER_TEMP/xma-invalid-input-test"
          "$RUNNER_TEMP/xma-invalid-input-test"
          clang++ -std=c++23 -pthread -I"$overlay/include" tools/test_wait_wakeups.cpp \
            -L"$overlay/lib" -lrexruntime -Wl,-rpath,"$overlay/lib" -o "$RUNNER_TEMP/wait-wakeups-test"
          "$RUNNER_TEMP/wait-wakeups-test"
          tools/package_sdk_overlay.sh "$PWD/rexglue-overlay-linux-amd64.tar.gz"
      - name: Compile performance overlay against stock nightly headers
        run: |
          # Also runs on an SDK cache hit: game sources aren't part of that cache key.
          if [ ! -d /usr/include/c++/14 ]; then
            launcher/packaging/ci_linux_sdk_setup.sh --compiler-only
          fi
          if [ ! -x "$HOME/llvm/bin/clang++" ]; then
            python3 launcher/packaging/ci_fetch.py llvm-linux "$HOME/llvm" --strip 1
          fi
          if [ ! -x "$HOME/cmake/bin/cmake" ]; then
            python3 launcher/packaging/ci_fetch.py cmake-linux "$HOME/cmake" --strip 1
          fi
          if [ ! -d "$HOME/rexglue-sdk-nightly/0.10.0.24/linux-amd64/include" ]; then
            python3 launcher/packaging/ci_fetch.py sdk-linux "$HOME/rexglue-sdk-nightly/0.10.0.24"
          fi
          tools/build_rexglue_sdk.sh --source-only
          "$HOME/cmake/bin/cmake" -S forza-recomp/tests/overlay-sdk -B "$RUNNER_TEMP/overlay-sdk" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="$HOME/llvm/bin/clang++" \
            -DCMAKE_PREFIX_PATH="$HOME/rexglue-sdk-nightly/0.10.0.24/linux-amd64" \
            -DFORZA_PATCHED_SDK_SOURCE="$HOME/rexglue-sdk-src-forza/sdk"
          "$HOME/cmake/bin/cmake" --build "$RUNNER_TEMP/overlay-sdk" --parallel 2
          "$HOME/cmake/bin/ctest" --test-dir "$RUNNER_TEMP/overlay-sdk" --output-on-failure
      - name: Benchmark and title-modal regression tests
        run: |
          "$HOME/cmake/bin/cmake" -S forza-recomp/tests/benchmark -B "$RUNNER_TEMP/benchmark-tests" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="$HOME/llvm/bin/clang++" \
            -DCMAKE_PREFIX_PATH="$HOME/rexglue-sdk-nightly/0.10.0.24/linux-amd64"
          "$HOME/cmake/bin/cmake" --build "$RUNNER_TEMP/benchmark-tests" --parallel 2
          "$HOME/cmake/bin/ctest" --test-dir "$RUNNER_TEMP/benchmark-tests" --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-overlay-linux
          path: rexglue-overlay-linux-amd64.tar.gz

  # The SDK for Windows (runtime, Vulkan-enabled Xenos plugin, codegen tool), built with clang-cl
  # against the runner's MSVC. The Microsoft headers and libraries are used to build only and are
  # not part of the result.
  sdk-windows:
    runs-on: windows-2022
    steps:
      # Keep line endings as committed: with autocrlf the patches get CRLF and git apply fails.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: rexglue-overlay-windows-amd64.tar.gz
          key: sdk-overlay-windows-${{ hashFiles('patches/rexglue-sdk/**', 'tools/build_rexglue_sdk.sh', 'tools/test_driver_pipeline_cache.cpp', 'tools/test_pipeline_store.cpp', 'tools/test_pipeline_prebuild.cpp', 'tools/test_vfs_host_errors.cpp', 'tools/tests/sdk-filesystem/**', 'tools/cmake/windows-native-clang-cl.cmake', 'launcher/forza_launcher/pins.py') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - if: steps.cache.outputs.cache-hit != 'true'
        name: LLVM, SDK source and patches
        shell: bash
        run: |
          python launcher/packaging/ci_fetch.py llvm-windows "$RUNNER_TEMP/llvm" --strip 1
          export REXSDK_SRC="$RUNNER_TEMP/sdk-src/sdk"
          tools/build_rexglue_sdk.sh --source-only
          python launcher/packaging/ci_patch_simde.py "$REXSDK_SRC/thirdparty/simde/simde/x86/sse.h"
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build and install the SDK
        shell: bash
        run: |
          export FORZA_LLVM_BIN="$RUNNER_TEMP/llvm/bin"
          export PATH="$FORZA_LLVM_BIN:$PATH"
          SRC="$RUNNER_TEMP/sdk-src/sdk"
          PREFIX="$RUNNER_TEMP/sdk-prefix"
          # clang-cl reads -Wall as -Weverything: millions of warning lines, a 56 minute build and a
          # log GitHub cannot serve. The build only needs the result, so warnings are off, and the
          # output goes to a file of which only the failures are shown.
          sed -i -E 's/^    -W(all|extra)$/    -w/' "$SRC/CMakeLists.txt"
          # clang-cl ignores two of the SDK's GCC-style flags: -fno-char8_t (xboxkrnl_ob.cpp passes
          # a u8 literal as std::string_view) and -ffp-model=strict. Their clang-cl spellings:
          sed -i -e 's|^    -fno-char8_t$|    /Zc:char8_t-|' -e 's|^    -ffp-model=strict$|    /fp:strict|' "$SRC/CMakeLists.txt"
          cmake -S "$SRC" -B "$SRC/out/build/win" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 -DREXGLUE_USE_VULKAN=ON -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/tools/cmake/windows-native-clang-cl.cmake"
          if ! cmake --build "$SRC/out/build/win" -- -k 0 > "$RUNNER_TEMP/build.log" 2>&1; then
            grep -a -n -B2 -A12 -E 'FAILED:|: error|LNK[0-9]+:' "$RUNNER_TEMP/build.log" | head -120
            tail -n 30 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          tail -n 3 "$RUNNER_TEMP/build.log"
          clang++ -std=c++20 -I"$SRC/include" tools/test_driver_pipeline_cache.cpp \
            -o "$RUNNER_TEMP/driver-cache-test.exe"
          "$RUNNER_TEMP/driver-cache-test.exe"
          clang++ -std=c++20 -I"$SRC/include" tools/test_pipeline_store.cpp \
            -o "$RUNNER_TEMP/pipeline-store-test.exe"
          "$RUNNER_TEMP/pipeline-store-test.exe"
          clang++ -std=c++20 -I"$SRC/include" tools/test_pipeline_prebuild.cpp \
            -o "$RUNNER_TEMP/pipeline-prebuild-test.exe"
          "$RUNNER_TEMP/pipeline-prebuild-test.exe"
          cmake --install "$SRC/out/build/win"
          cmake -S tools/tests/sdk-filesystem -B "$RUNNER_TEMP/sdk-filesystem" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/tools/cmake/windows-native-clang-cl.cmake"
          cmake --build "$RUNNER_TEMP/sdk-filesystem" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/sdk-filesystem" --output-on-failure
          cp "$SRC/LICENSE" "$PREFIX/LICENSE-rexglue-sdk.txt"
          tar -C "$PREFIX" -czf rexglue-overlay-windows-amd64.tar.gz .
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-windows-build-log
          path: ${{ runner.temp }}/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-overlay-windows
          path: rexglue-overlay-windows-amd64.tar.gz

  launcher-linux:
    needs: sdk-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: sdk-overlay-linux
          path: overlay
      - name: Version
        run: |
          v="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || v="0.0.0-dev.${GITHUB_SHA::7}"
          printf '"""Launcher version."""\n__version__ = "%s"\n' "$v" > launcher/forza_launcher/_version.py
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build the launcher
        run: |
          pip install -r launcher/requirements.txt -r launcher/requirements-build.txt
          cd launcher
          pyinstaller --noconfirm forza-launcher.spec
          dist/forza-launcher/forza-launcher --version
      - name: Smoke test the window
        timeout-minutes: 5
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3
          QT_QPA_PLATFORM=offscreen python -m unittest discover -s launcher -p 'test_gamepad.py' -v
          launcher/dist/forza-launcher/forza-launcher --run-script launcher/packaging/gamepad_smoke.py gamepad-smoke.txt
          test -s gamepad-smoke.txt
          QT_QPA_PLATFORM=offscreen timeout --kill-after=5s 10s launcher/dist/forza-launcher/forza-launcher || [ $? -eq 124 ]
      - name: Package
        run: |
          python launcher/packaging/make_package.py --platform linux \
            --pyinstaller-dist launcher/dist/forza-launcher \
            --overlay overlay/rexglue-overlay-linux-amd64.tar.gz --out out --tar --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-linux
          path: out/*.tar.gz

  launcher-windows:
    needs: sdk-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: sdk-overlay-windows
          path: overlay
      - name: Version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || v="0.0.0-dev.${GITHUB_SHA::7}"
          printf '"""Launcher version."""\n__version__ = "%s"\n' "$v" > launcher/forza_launcher/_version.py
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build the launcher
        shell: bash
        run: |
          pip install -r launcher/requirements.txt -r launcher/requirements-build.txt pillow
          QT_QPA_PLATFORM=offscreen python -m unittest discover -s launcher -p 'test_gamepad.py' -v
          cd launcher
          pyinstaller --noconfirm forza-launcher.spec
          dist/forza-launcher/forza-launcher.exe --version
          dist/forza-launcher/forza-launcher.exe --run-script packaging/gamepad_smoke.py gamepad-smoke.txt
          test -s gamepad-smoke.txt
      - name: Smoke test the packaged window
        shell: bash
        run: python launcher/packaging/smoke_gui.py launcher/dist/forza-launcher/forza-launcher.exe
      - name: Package
        shell: bash
        run: |
          python launcher/packaging/make_package.py --platform windows \
            --pyinstaller-dist launcher/dist/forza-launcher \
            --overlay overlay/rexglue-overlay-windows-amd64.tar.gz --out out --version "$VERSION"
      - name: Installer (Inno Setup, with the Visual C++ 2015-2022 x64 redistributable)
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile vc_redist.x64.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:VERSION" "/DStage=$PWD\out\ForzaHorizon1-ReImagined" "/DRedist=$PWD\vc_redist.x64.exe" "/DOut=$PWD\installer" launcher\packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: installer/*.exe

  # The installer on a clean Windows machine: silent install, files and shortcuts, the launcher's
  # --version and --dry-run, silent uninstall (launcher/packaging/test_installer.ps1).
  installer-test:
    needs: launcher-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: launcher-windows
          path: installer
      - shell: pwsh
        run: |
          $exe = (Get-ChildItem installer\*Setup*.exe | Select-Object -First 1).FullName
          launcher\packaging\test_installer.ps1 -Setup $exe

  # The Linux Flatpak: the launcher run by the freedesktop SDK 26.08 (which also builds the game on
  # the player's machine, with the SDK's LLVM extension), the project sources and the patched SDK
  # pieces of sdk-linux. Also holds no game code. Built with flatpak-builder in the flathub image.
  flatpak:
    needs: sdk-linux
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sdk-overlay-linux
          path: overlay
      - name: Stage the files the Flatpak installs
        run: |
          v="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || v="0.0.0-dev.$(echo "$GITHUB_SHA" | cut -c1-7)"
          # the SDK's license (BSD-3-Clause), reproduced with its patched pieces; the pinned commit of pins.SDK_TAG
          curl -fsSL -o rexglue-sdk-LICENSE https://raw.githubusercontent.com/rexglue/rexglue-sdk/bd833a2ab69d305f99ddf57418fc38ffec8af93d/LICENSE
          python3 flatpak/stage.py --overlay overlay/rexglue-overlay-linux-amd64.tar.gz \
            --sdk-license rexglue-sdk-LICENSE --version "$v"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@aa777012a985fe1b1fd3e66ea2173609cf0c9a70 # v6.8
        with:
          bundle: ForzaHorizon1-ReImagined-x86_64.flatpak
          manifest-path: flatpak/io.github.dyotson.ForzaHorizon1ReImagined.yml
          cache: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: ForzaHorizon1-ReImagined-x86_64.flatpak

  publish:
    if: github.ref_type == 'tag'
    needs: [launcher-tests, launcher-linux, launcher-windows, installer-test, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Installers for the Forza Horizon 1: ReImagined launcher. They contain no game code and no game data: the launcher builds the game on your computer from your own copy of Forza Horizon (Games on Demand package). See https://dyotson.github.io/ForzaHorizon1-ReImagined/"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "$notes"
          # The SDK overlays are artifacts only for the packaging jobs; every package carries its own.
          rm -f assets/rexglue-overlay-*.tar.gz
          gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber
