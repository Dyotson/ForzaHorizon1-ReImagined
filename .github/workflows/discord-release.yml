# Posts a published release to the Discord announcements channel through a webhook.
# Set the secret DISCORD_WEBHOOK_URL in the "announcements" environment (Discord: channel settings > Integrations >
# Webhooks > New Webhook > Copy Webhook URL). Without it the job does nothing.
# A release published with the workflow's own GITHUB_TOKEN does not trigger this; releases
# published by a person (or `gh release edit --draft=false`) do. Run it by hand to (re)post a tag.
name: discord-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to post (e.g. v0.1.3)
        required: true

permissions:
  # write: the post's message id is kept in the release notes, so publishing again edits it
  contents: write

jobs:
  post:
    runs-on: ubuntu-24.04
    # The webhook secret lives in this environment, usable only from v* tags and main.
    environment: announcements
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          # The Discord role to ping ("Updates ping", opt-in), its numeric ID as a repository
          # variable. Unset: the post pings nobody.
          ROLE: ${{ vars.DISCORD_UPDATES_ROLE_ID }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; nothing to post."
            exit 0
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,body,url,isPrerelease > release.json
          jq -n --slurpfile r release.json --arg repo "$GITHUB_REPOSITORY" --arg role "$ROLE" '
            $r[0] as $rel
            | ($rel.body | gsub("\\s*<!-- discord-message: [0-9]+ -->\\s*"; "") | if length > 3500 then .[0:3500] + "\n\n[...]" else . end) as $notes
            | {
                username: "Forza Horizon 1: ReImagined",
                avatar_url: "https://raw.githubusercontent.com/\($repo)/main/docs/images/logo.png",
                content: (if ($role | test("^[0-9]+$")) then "<@&\($role)>" else "" end),
                embeds: [{
                  title: $rel.name,
                  url: $rel.url,
                  description: ($notes + "\n\n**[Download](\($rel.url))** · [Website](https://forza.dyotson.dev)"),
                  color: 16747843,
                  thumbnail: { url: "https://raw.githubusercontent.com/\($repo)/main/docs/images/logo.png" },
                  footer: { text: (if $rel.isPrerelease then "Pre-release" else "Windows installer · Linux Flatpak and .tar.gz" end) }
                }],
                allowed_mentions: { parse: [], roles: (if ($role | test("^[0-9]+$")) then [$role] else [] end) }
              }' > payload.json
          # One post per release: a release published again (or a manual re-run) edits the message
          # posted the first time, whose id is kept in an HTML comment at the end of the notes.
          MSG=$(jq -r '.body' release.json | sed -n 's/.*<!-- discord-message: \([0-9][0-9]*\) -->.*/\1/p' | tail -n 1)
          if [ -n "$MSG" ] && curl -fsS -X PATCH -H "Content-Type: application/json" --data @payload.json "$WEBHOOK/messages/$MSG" > /dev/null; then
            echo "Updated the Discord post of $TAG (message $MSG)."
            exit 0
          fi
          MSG=$(curl -fsS -H "Content-Type: application/json" --data @payload.json "$WEBHOOK?wait=true" | jq -r '.id')
          echo "Posted $TAG to Discord (message $MSG)."
          jq -r '.body' release.json | sed 's/[[:space:]]*<!-- discord-message: [0-9]* -->[[:space:]]*$//' > notes.md
          printf '\n\n<!-- discord-message: %s -->\n' "$MSG" >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md > /dev/null
