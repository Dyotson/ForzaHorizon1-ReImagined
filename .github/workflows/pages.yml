# Publishes site/ (the landing page) to GitHub Pages on every push to main that changes it,
# and once a day with a fresh copy of the public server's leaderboards (data/leaderboards.json).
# The page uses the project's logo and screenshots from docs/images, copied in here. The
# leaderboards map (site/images/colorado-map.svg, site/data/map_points.json) is in site/.
# The server is plain http (a tunnel), which the https site cannot fetch from the browser: the
# job fetches it and the site serves the copy.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r site/. _site/
          mkdir -p _site/images
          cp docs/images/*.jpg docs/images/logo.svg docs/images/logo.png docs/images/social-preview.png _site/images/
          touch _site/.nojekyll
      - name: Copy the public server's leaderboards
        env:
          LEADERBOARDS_URL: http://forza-reimagined.playit.plus:56678/leaderboards/snapshot
        run: |
          mkdir -p _site/data
          if curl -fsS --max-time 60 --retry 2 "$LEADERBOARDS_URL" -o _site/data/leaderboards.json \
             && python3 -c "import json; d = json.load(open('_site/data/leaderboards.json')); assert isinstance(d['boards'], list)"; then
            echo "leaderboards copied"
          else
            rm -f _site/data/leaderboards.json
            # A scheduled run must not replace the published site with one that has no scores.
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then echo "server unreachable"; exit 1; fi
            echo "::warning::the leaderboards could not be copied; the page shows an error"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
