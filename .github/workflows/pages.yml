# Publishes site/ (the landing page) to GitHub Pages on every push to main that changes it.
# The page uses the project's logo and screenshots from docs/images, copied in here.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r site/. _site/
          mkdir -p _site/images
          cp docs/images/*.jpg docs/images/logo.svg docs/images/logo.png docs/images/social-preview.png _site/images/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
