name: physics-telemetry-tests
on:
  pull_request:
    branches: [main, feature/physics-trigger-feedback]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physics-reader:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang-cl /nologo /std:c++20 /EHsc /W4 /WX /UNDEBUG forza-recomp/tests/car_physics_test.cpp /Fe:physics-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\physics-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os != 'Windows'
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -UNDEBUG forza-recomp/tests/car_physics_test.cpp -o physics-test
          ./physics-test
