# Checks the public Forza Live server from outside the home network: TCP status page and a
# UDP HELLO -> WELCOME (tools/server_probe.py). Run by hand, and every 6 hours.
name: server-probe

on:
  workflow_dispatch:
    inputs:
      server:
        description: host:port of the server's UDP port
        default: forza-reimagined.playit.plus:56677
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/server_probe.py "${{ inputs.server || 'forza-reimagined.playit.plus:56677' }}"
